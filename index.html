<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breaking Primitives into Entities</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
    <a-scene>
        
        <!-- Step 3: Asset Management for Background Image -->
        <a-assets>
            <img id="L10-img-BG" src="L10-img-background.jpg">
        </a-assets>

        <!-- Step 3: Background Image -->
        <!-- Positioned far back and scaled up to act as a backdrop -->
        <a-image src="#L10-img-BG" position="0 1.6 -11" scale="12 9 1"></a-image>

        <!-- Step 1 & 5: The Box Primitive -->
        <!-- Primitive shorthand: A-Frame automatically adds geometry, material, etc. -->
        <!-- Changed to Red and moved left per Step 5 -->
        <a-box color="#AA0000" height="1.5" position="-1 0.5 -4"></a-box>

        <!-- Step 2 & 5: The Custom Entity -->
        <!-- This is the longhand version of the box above. It does the exact same thing. -->
        <a-entity geometry="primitive: box; height: 1.5"
                  material="shader: standard; color: #AA0000"
                  position="1 0.5 -4">
        </a-entity>

        <!-- Step 4: Recreate a Curved Image from Components -->
        <!-- Instead of using <a-curvedimage>, we use a Cylinder with open ends and a flat material -->
        <a-entity geometry="primitive: cylinder;
                            theta-length: 90;
                            theta-start: 135;
                            radius: 0.707;
                            height: 0.833;
                            open-ended: true"
                  material="shader: flat;
                            color: #FFFFFF;
                            side: double;
                            src: #L10-img-BG"
                  position="0 1.5 0"
                  scale="-10 10 10">
        </a-entity>

    </a-scene>
</body>
</html>
