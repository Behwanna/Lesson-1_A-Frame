<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <title>Animating 3D Objects in A-Frame VR</title>
</head>
<body>
    <a-scene>
        <!-- Asset Management System -->
        <a-assets>
            <img id="floor" src="assets/floor-1024.jpg">
        </a-assets>

        <!-- Floor -->
        <a-plane src="#floor" shader="flat" rotation="-90 0 0" scale="10 10 1"></a-plane>

        <!-- Camera -->
        <a-entity position="0 2 8">
            <a-camera></a-camera>
        </a-entity>

        <!-- Red Box Rotation -->
        <!-- The red box keeps rotating in place -->
        <a-box color="#AA0000"
               position="0 4 0"
               animation="property: rotation;
                          to: 0 360 0;
                          loop: true;
                          dur: 5000;
                          easing: linear">
        </a-box>

        <!-- Green Box Orbiting -->
        <!-- The parent rotates while the green box moves around it -->
        <a-entity position="0 4 0"
                  animation="property: rotation;
                             to: 0 -360 0;
                             loop: true;
                             dur: 5000;
                             easing: linear">

            <!-- The green box is placed 2 meters away from the parent -->
            <a-box color="#00AA00"
                   position="2 0 0"
                   animation="property: rotation;
                              to: 0 -360 0;
                              loop: true;
                              dur: 5000;
                              easing: linear">
            </a-box>
        </a-entity>

        <!-- Yellow Box Movement -->
        <!-- The yellow box moves back and forth -->
        <a-box color="#FFAA00"
               position="0 0.5 0"
               animation="property: position;
                          from: -2 0.5 -2;
                          to: -2 0.5 2;
                          loop: true;
                          dir: alternate;
                          dur: 3000;
                          easing: easeInOutCubic">
        </a-box>

        <!-- Orange Box Scaling -->
        <!-- The orange box gets bigger and smaller -->
        <a-box color="#FFAA00"
               position="2 0.5 0"
               animation="property: scale;
                          to: 0.2 1 5;
                          loop: true;
                          dir: alternate;
                          dur: 3000;
                          easing: easeInOutElastic">
        </a-box>

        <!-- Blue Sphere Color -->
        <!-- The blue sphere changes its color back and forth -->
        <a-sphere color="#0000AA"
                  radius="0.5"
                  position="0 2.25 0"
                  animation="property: material.color;
                             from: #0000FF;
                             to: #0000AA;
                             loop: true;
                             dir: alternate;
                             dur: 1500">
        </a-sphere>

        <!-- Grey Cone Opacity -->
        <!-- The grey cone fades in and out -->
        <a-cone color="#484848"
                position="0 0.5 0"
                animation="property: opacity;
                           from: 1;
                           to: 0;
                           loop: true;
                           dir: alternate;
                           dur: 1500">
        </a-cone>

    </a-scene>
</body>
</html>
