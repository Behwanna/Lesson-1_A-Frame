<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creating a Custom Ground</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
    <a-scene>

        <!-- Floor images -->
        <!-- Loaded the floor texture and normal map -->
        <a-assets>
            <img id="floor" src="assets/concrete_floor_damaged_01_diff_4k.jpg">
            <img id="floor-NRM" src="assets/concrete_floor_damaged_01_nor_gl_4k.png">
        </a-assets>

        <!-- Ground plane -->
        <!-- Added the floor texture and repeated it to cover a larger area -->
        <a-plane material="color: #FFFFFF; 
                           src: #floor; 
                           repeat: 5 5; 
                           normal-map: #floor-NRM; 
                           normal-texture-repeat: 5 5;
                           roughness: 0.6"
                  rotation="-90 0 0"
                  scale="10 10 1">
        </a-plane>

        <!-- Light -->
        <!-- Added light to make the floor texture more visible -->
        <a-entity light="type: directional; color: #FFF; intensity: 1.5" position="-1 3 2"></a-entity>

    </a-scene>
</body>
</html>
