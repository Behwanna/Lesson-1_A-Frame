<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <title>Precision Lighting Using the A-Frame Inspector</title>
</head>

<body>
    <!-- Added shadow component to the scene for realism -->
    <a-scene shadow="type: pcfsoft">
        
        <!-- Asset Management System -->
        <a-assets>
            <img id="floor" src="assets/floor-1024.jpg">
            <a-asset-item id="tl" src="assets/traffic-light/traffic-light.gltf"></a-asset-item>
            <a-asset-item id="ssl" src="assets/suburban-street-lamp/suburban-street-lamp.gltf"></a-asset-item>
        </a-assets>

        <!-- Custom Light | Ambient -->
        <a-entity light="type: ambient; intensity: 0.2"></a-entity>

        <!-- Custom Light | Directional -->
        <a-entity light="type: directional; intensity: 0.2" position="-0.5 1 1"></a-entity>

        <!-- Sky -->
        <a-sky color="#212121"></a-sky>

        <!-- Ground -->
        <a-plane src="#floor" rotation="-90 0 0" scale="5 5 1" repeat="2 2" shadow="receive: true"></a-plane>

        <!-- Camera -->
        <a-entity position="0 0 3">
            <a-camera></a-camera>
        </a-entity>

        <!-- Your 3D Model 01 | Traffic Light -->
        <a-entity gltf-model="#tl" position="-1 0.1 0" scale="0.7 0.7 0.7" shadow="cast: true; receive: true">
            
            <!-- Add a Red Light to the Traffic Light Model -->
            <!-- These exact coordinates were generated by the A-Frame Inspector -->
            <a-entity id="Red-Light" 
                      position="0.520 1.780 0.155" 
                      light="color: #cc0000; distance: 0.2; intensity: 4; type: point">
            </a-entity>
            
        </a-entity>

        <!-- Your 3D Model 02 | Suburban Street Lamp -->
        <a-entity gltf-model="#ssl" position="2 1.2 0" rotation="0 180 0" shadow="cast: true; receive: true">
            
            <!-- Add a Yellow Light to the Street Lamp -->
            <!-- Positioned at the center of the lamp's bulb -->
            <a-entity id="Light-Bulb" 
                      position="0.963 2.00201 0.00166" 
                      light="color: #FFCC00; distance: 8; intensity: 5; type: point; decay: 1">
            </a-entity>

            <!-- Add a Spot Light (Light Cone) -->
            <!-- Rotated -90 0 0 to point downwards, creating a cone of light -->
            <a-entity id="Light-Cone" 
                      position="0.97107 1.55284 0.0224" 
                      light="color: #FFCC00; intensity: 2; type: spot; decay: 2; angle: 45; penumbra: 0.3" 
                      rotation="-90 0 0">
            </a-entity>

        </a-entity>

    </a-scene>
</body>
</html>
