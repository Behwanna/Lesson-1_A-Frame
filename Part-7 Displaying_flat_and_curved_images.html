<!DOCTYPE html>
<!-- Part 7 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Displaying Flat and Curved Images</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
    <a-scene>

        <!-- Images used in the scene -->
        <!-- Loaded the images before displaying them -->
        <a-assets>
            <img id="L09-img-01" src="L09-img-1024x768-flat.jpg">
            <img id="L09-img-02" src="L09-img-1024x768-curved.jpg">
            <img id="L09-img-03" src="L09-img-1024x768-curved-layout-R.jpg">
            <img id="L09-img-04" src="L09-img-1024x768-curved-layout-C.jpg">
            <img id="L09-img-05" src="L09-img-1024x768-curved-layout-L.jpg">
        </a-assets>

        <!-- Flat image -->
        <!-- Set the image size to keep its original shape -->
        <a-image src="#L09-img-01"
                 position="0 1.5 -3"
                 width="1"
                 height="0.75"
                 scale="3 3 1">
        </a-image>

        <!-- Curved image -->
        <!-- Made the image curve using A-Frame -->
        <a-curvedimage src="#L09-img-02"
                       theta-length="90"
                       theta-start="135"
                       radius="0.707"
                       height="0.833"
                       position="0 1.5 0"
                       scale="3 3 3">
        </a-curvedimage>

        <!-- Red box -->
        <!-- Added a transparent red box to show the width -->
        <a-box color="#AA0000"
               opacity="0.5"
               width="3"
               height="0.1"
               depth="3"
               position="0 1.5 -1.5">
        </a-box>

        <!-- Three curved images -->

        <!-- Right image -->
        <a-curvedimage src="#L09-img-03"
                       theta-length="50"
                       theta-start="90"
                       radius="0.5"
                       height="0.327"
                       position="0 1.5 0"
                       scale="3 3 3">
        </a-curvedimage>

        <!-- Center image -->
        <a-curvedimage src="#L09-img-04"
                       theta-length="50"
                       theta-start="155"
                       radius="0.5"
                       height="0.327"
                       position="0 1.5 0"
                       scale="3 3 3">
        </a-curvedimage>

        <!-- Left image -->
        <a-curvedimage src="#L09-img-05"
                       theta-length="50"
                       theta-start="220"
                       radius="0.5"
                       height="0.327"
                       position="0 1.5 0"
                       scale="3 3 3">
        </a-curvedimage>

    </a-scene>
</body>
</html>
