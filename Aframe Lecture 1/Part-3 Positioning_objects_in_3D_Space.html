<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning Objects in 3D Space</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
    <a-scene>

        <!-- Grey cylinder -->
        <a-cylinder color="#616161"
                    height="2"
                    radius="2"
                    segments-radial="6"
                    open-ended="true"
                    side="double"
                    position="0 0 -1">
        </a-cylinder>

        <!-- Sky Blue Box -->
        <!-- Moved the box higher above the cylinder -->
        <a-box color="#4CC3D9"
               width="8"
               height="4.5"
               depth="0.2"
               position="0 4 -8">

            <!-- Dark grey circle inside the box -->
            <a-circle color="#333333"
                      side="double"
                      position="2 0 0.11">
            </a-circle>

        </a-box>

        <!-- Yellow circle -->
        <a-circle color="#FFC107"
                  side="double"
                  position="-2 3 -6.89">
        </a-circle>

    </a-scene>
</body>
</html>
