<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breaking Primitives into Entities</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
    <a-scene>

        <!--Adding the background image as an asset -->
        <a-assets>
            <img id="L10-img-BG" src="L10-img-background.jpg">
        </a-assets>

        <!--Displaying the background image -->
        <!--Placed at the back and enlarged to cover the scene -->
        <a-image src="#L10-img-BG" position="0 1.6 -11" scale="12 9 1"></a-image>

        <!--Creating a box using a primitive -->
        <!--Set the color to sky blue and moved it to the left -->
        <a-box 
            color="#87CEEB" 
            height="1.5" 
            position="-1 0.5 -4">
        </a-box>

        <!--Creating a box using a custom entity -->
        <!--Same box as the primitive, but using geometry and material components -->
        <a-entity geometry="primitive: box; height: 1.5"
                  material="shader: standard; color: #87CEEB"
                  position="1 0.5 -4">
        </a-entity>

        <!--Creating a curved image using a cylinder -->
        <!--Used cylinder components instead of a curved image primitive -->
        <a-entity geometry="primitive: cylinder;
                            theta-length: 90;
                            theta-start: 135;
                            radius: 0.707;
                            height: 0.833;
                            open-ended: true"
                  material="shader: flat;
                            color: #FFFFFF;
                            side: double;
                            src: #L10-img-BG"
                  position="0 1.5 0"
                  scale="-10 10 10">
        </a-entity>

    </a-scene>
</body>
</html>
