<!DOCTYPE html>
<!-- Part 2 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creating 3D Objects with A-Frame Primitives</title>
    <!-- Load the A-Frame library -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
    <a-scene>
        <!-- Green box -->
        <a-box color="#689F38"
               width="7"
               height="2.5"
               depth="0.5"
               position="-2 1.25 -5">
        </a-box>

        <!-- Grey cylinder -->
        <a-cylinder color="#616161"
                    height="2"
                    radius="2"
                    segments-radial="6"
                    open-ended="true"
                    side="double"
                    position="-2 1 -5">
        </a-cylinder>
    </a-scene>
</body>
</html>
