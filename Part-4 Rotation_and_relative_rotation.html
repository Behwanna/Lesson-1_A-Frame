<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotation and Relative Rotation</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
    <a-scene>

        <!-- Rotated cylinder -->
        <a-cylinder color="#616161"
                    height="2"
                    radius="2"
                    segments-radial="6"
                    open-ended="true"
                    side="double"
                    position="0 1 0"
                    rotation="0 -90 90">
        </a-cylinder>

        <!-- Green box -->
        <!-- Rotated the box to make it lie flat -->
        <a-box color="#689F38"
               width="4"
               height="2"
               depth="0.2"
               position="0 1 -7"
               rotation="90 0 0">

            <!-- Dark grey circle inside the box -->
            <!-- The circle follows the box's rotation -->
            <a-circle color="#333333"
                      side="double"
                      position="2 0 0"
                      rotation="90 0 0">
            </a-circle>

        </a-box>

        <!-- Yellow circle -->
        <!-- Placed outside the box so it does not follow its rotation -->
        <a-circle color="#FFC107"
                  side="double"
                  position="-2 1 -7">
        </a-circle>

    </a-scene>
</body>
</html>
